name: Deploy frontend (fanusopc.com + khansoft.az staging)

# master-ə hər push-da serverdə `deploy.sh` işə düşür: git pull → npm ci →
# build → systemctl restart. PROD (/var/www/fanusopcfrontend, port 3000,
# fanusopc.com + panellər) və STAGING (/var/www/fanusopcfrontend-staging,
# port 3002, khansoft.az) PARALEL yenilənir (hər qovluğun öz kilidi var,
# server 4 nüvə + kifayət qədər RAM ilə ikisini eyni anda daşıyır).
#
# 07.08.2026: əvvəl STAGING prod bitəndən SONRA başlayırdı — hər ikisi tam
# `npm run build` apardığı üçün (~5 dəq/ədəd) cəmi deploy vaxtı 5 dəq-dən
# 10-11 dəq-ə qalxdı. Paralelə keçirilib, ~5-6 dəq-ə düşdü.
#
# 18.08.2026: npm ci indi package-lock.json dəyişməyəndə ötürülür, webpack
# keşi (.next/cache) atomik swap-dan sonra da köçürülür (deploy.sh, serverdə) —
# build ~60-95s-ə düşdü. Bundan sonra qalan ən böyük itki: CI job STAGING
# bitənə qədər gözləyirdi, halbuki STAGING uğursuz olsa belə PROD-u BLOKLAMIR
# (aşağıda). Ona görə STAGING artıq serverdə ARXA PLANDA (nohup+disown) buraxılır,
# CI job onu GÖZLƏMİR — job PROD bitən kimi bitir. STAGING öz loguna yazır
# (serverdə /var/www/fanusopcfrontend-staging/last-deploy.log), problem olsa
# ora baxılmalıdır.
#
# PROD uğursuz olsa job "uğursuz"dur. STAGING uğursuz olsa yalnız xəbərdarlıq —
# prod bunun girovu deyil.
on:
  push:
    branches: [master]
    # Workflow fayllarına/sənədlərə edilən dəyişikliklər kodu dəyişmir —
    # bunlar deploy tetiklməməlidir (bax fanusopcbackend/deploy.yml, 07.08.2026).
    paths-ignore:
      - '.github/workflows/**'
      - '**.md'
  workflow_dispatch: {}

# Eyni anda iki deploy getməsin; işləyəni yarıda kəsmə (build tam bitsin).
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -uo pipefail
          # GitHub Actions `run:` addımlarını defolt `bash -e {0}` ilə işə salır —
          # yuxarıdakı `set -uo pipefail` bunu SÖNDÜRMÜR (yalnız əlavə edir). PROD
          # SSH çağırışının exit kodunu özümüz yoxlayırıq (aşağıda) — miras `-e`
          # aktiv qalsa, uğursuz olanda skript SƏSSİZCƏ ölür, heç bir log çap
          # olunmur (08.08.2026-da baş verdi: "Process completed with exit code 1",
          # heç bir izah yox). Ona görə açıq şəkildə söndürülür.
          set +e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          echo ">> STAGING serverdə arxa planda başladılır (CI onu gözləmir)..."
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "$USER@$HOST" \
            'if [ -d /var/www/fanusopcfrontend-staging ]; then
               cd /var/www/fanusopcfrontend-staging
               nohup env SERVICE=fanus-frontend-staging PORT=3002 HOSTHDR=khansoft.az \
                 bash deploy.sh > last-deploy.log 2>&1 < /dev/null &
               disown
               echo "STAGING başladıldı (log: last-deploy.log)"
             else
               echo "ℹ️ staging qovluğu yoxdur — ötürülür"
             fi'

          echo ">> PROD deploy edilir (CI bunu gözləyir)..."
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "$USER@$HOST" \
            'bash /var/www/fanusopcfrontend/deploy.sh'
          PROD_EXIT=$?

          if [ "$PROD_EXIT" -ne 0 ]; then
            echo "❌ PROD deploy uğursuz oldu (exit $PROD_EXIT)"
            exit 1
          fi
          echo "✅ PROD deploy uğurlu"
